[package]
name = "codegenr"
version = "0.0.7"
edition = "2021"
authors = ["Jérôme Rx & contributors <jerome@eventuallyconsultant.com>"]
description = "Fast json/yaml/openapi code generator based on handlebars templating."
readme = "../README.md"
repository = "https://github.com/eventuallyconsultant/codegenr/"
keywords = ["codegen", "openapi", "api-first", "contract-first", "api"]
categories = ["development-tools"]
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "codegenr_lib"
path = "src/lib.rs"

[[bin]]
name = "codegenr"
path = "src/bin/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
bin = ["tracing-subscriber", "clap", "anyhow"]

[dependencies]
# ========================================================================================
#                         Binary dependencies
# ========================================================================================
tracing-subscriber = { version = "0.3", features = [], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }


# ========================================================================================
#                         Common dependencies
# ========================================================================================
# Logging
tracing = { version = "0.1", features = ["log"] }
# Errors
thiserror = "2.0"
# File loading & path manipulations
url = "2.4"
path-dedot = "3.1"
# rustls rather than native-tls, which is openssl on Linux; the native roots keep trusting the certificates of the OS store, as native-tls did
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "charset",
  "http2",
  "macos-system-configuration",
  "rustls-tls-native-roots",
] }
walkdir = "2"
glob = "0.3"

# file formats manipulation
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.8"                                              # 0.9 failing with deserializing from YAML containing more than one document is not supported on most files
serde = "1.0"
graphql-parser = "0.4"
roxmltree = "0.21"
csv = "1.4"
toml = "0.9"

# Templating
# DO NOT UPGRADE: up to 6.4.4 at least, a partial called from an `#each` loses `../` (`@key` too before 6.4.2),
# shown by the `partials_called_from_an_each_see_its_variables` test of render.rs
handlebars = { version = "5.1.2", features = ["script_helper"] }
handlebars_misc_helpers = { version = "0.16.3", features = ["default"] }
# Regex
regex = "1"
# Transliteration to ascii, the `to_ascii` helper
deunicode = "1"
once_cell = "1"
# Custom scripting
rhai = "1"

[dev-dependencies]
test-case = "3.1"
tempfile = "3"
anyhow = "1.0"
